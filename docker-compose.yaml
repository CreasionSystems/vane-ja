services:
  vane:
    # Locally built image: this tree carries the Japanese i18n changes,
    # so it must not be confused with the upstream Docker Hub tag.
    image: vane:ja
    build:
      context: .
    ports:
      - '3000:3000'
    volumes:
      - data:/home/vane/data
    restart: unless-stopped

volumes:
  data:
    name: 'vane-data'
