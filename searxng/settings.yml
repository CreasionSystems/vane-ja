use_default_settings: true

general:
  instance_name: 'searxng'

search:
  autocomplete: 'google'
  formats:
    - html
    - json

server:
  # Replaced at container start by entrypoint.sh with SEARXNG_SECRET, or with
  # a random value when that is unset. Do not commit a real key here.
  secret_key: 'set-at-container-start'

engines:
  - name: wolframalpha
    disabled: false
